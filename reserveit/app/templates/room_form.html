{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}{{ 'Edit room' if editing else 'Add room' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit room' if editing else 'Add a room' }}</h1>
<form class="panel" method="post">
  {{ csrf() }}
  <label for="room_name">Room name</label><input id="room_name" name="room_name" maxlength="50" required value="{{ room.get('room_name', '') }}">
  <label for="building">Building</label><input id="building" name="building" maxlength="50" required value="{{ room.get('building', '') }}">
  <label for="capacity">Capacity (seats)</label><input id="capacity" name="capacity" type="number" min="1" required value="{{ room.get('capacity', '') }}">
  <label for="room_type">Room type</label>
  <select id="room_type" name="room_type" required>{% for t in types %}<option value="{{ t }}" {{ 'selected' if room.get('room_type') == t }}>{{ t|capitalize }}</option>{% endfor %}</select>
  <div class="actions"><button class="btn">Save room</button><a class="btn quiet" href="{{ url_for('main.rooms') }}">Cancel</a></div>
</form>
{% endblock %}
