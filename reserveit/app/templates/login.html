{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth panel">
  <h1>Log in</h1>
  <p class="lead">Reserve classrooms and borrow materials for your classes and events.</p>
  <form method="post">
    {{ csrf() }}
    <label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" required>
    <div class="actions"><button class="btn">Log in</button><a class="btn quiet" href="{{ url_for('auth.register') }}">Create an account</a></div>
  </form>
</div>
{% endblock %}
